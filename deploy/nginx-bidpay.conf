# A copy of /etc/nginx/conf.d/bidpay.conf on the BiD server (103.153.141.134), kept here for reference.
# The server's file is the live one; this copy is not deployed by anything. The bid.mn sites are in bid_web.conf
# next to it and use the same proxy settings.
#
# The certificate is Let's Encrypt, from certbot (installed with snap; the server's apt mirror was unreachable):
#   certbot certonly --webroot -w /var/www/html -d bidpay.mn -d www.bidpay.mn --deploy-hook "systemctl reload nginx"
# It renews by itself and reloads nginx when it does. Check with: certbot renew --dry-run

server {
    listen 80;
    server_name bidpay.mn www.bidpay.mn;
    # Let's Encrypt checks the domain here when issuing and renewing the certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://bidpay.mn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bidpay.mn www.bidpay.mn;
    ssl_certificate /etc/letsencrypt/live/bidpay.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bidpay.mn/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
